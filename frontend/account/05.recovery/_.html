<!--use:main-->

<!--define:title-->Reestablecer Contraseña<!--/define:title-->

<!--define:head-->

  <style>
		.password-field-wrapper {
			position: relative;
		}

		.password-toggle {
			position: absolute;
			right: 12px;
			top: 50%;
			transform: translateY(-50%);
			cursor: pointer;
			color: #6c757d;
			border: none;
			background: none;
			padding: 0;
			font-size: 1rem;
			z-index: 10;
			transition: color 0.2s;
		}

		.password-toggle:hover {
			color: #495057;
		}

		.form-control {
			padding-right: 38px;
		}

		.requirements-list {
			font-size: 0.875rem;
			margin-top: 12px;
			padding: 12px;
			background-color: #f8f9fa;
			border-radius: 4px;
		}

		.requirement {
			display: flex;
			align-items: center;
			margin-bottom: 8px;
			transition: color 0.2s;
		}

		.requirement:last-child {
			margin-bottom: 0;
		}

		.requirement-icon {
			width: 20px;
			height: 20px;
			display: flex;
			align-items: center;
			justify-content: center;
			margin-right: 8px;
			font-size: 0.75rem;
			border-radius: 50%;
			flex-shrink: 0;
		}

		.requirement.met .requirement-icon {
			background-color: #d4edda;
			color: #155724;
		}

		.requirement.unmet .requirement-icon {
			background-color: #e2e3e5;
			color: #6c757d;
		}

		.requirement.met {
			color: #155724;
		}

		.requirement.unmet {
			color: #6c757d;
		}

		.strength-indicator {
			height: 4px;
			background-color: #e9ecef;
			border-radius: 2px;
			margin-top: 8px;
			overflow: hidden;
		}

		.strength-bar {
			height: 100%;
			width: 0%;
			background-color: #dc3545;
			transition: width 0.3s, background-color 0.3s;
		}

		.strength-bar.weak {
			width: 33%;
			background-color: #dc3545;
		}

		.strength-bar.fair {
			width: 66%;
			background-color: #ffc107;
		}

		.strength-bar.strong {
			width: 100%;
			background-color: #28a745;
		}

		.error-message {
			display: none;
			font-size: 0.875rem;
			color: #dc3545;
			margin-top: 8px;
			align-items: center;
			gap: 6px;
		}

		.error-message.show {
			display: flex;
		}

		.success-message {
			display: none;
			font-size: 0.875rem;
			color: #28a745;
			margin-top: 8px;
			align-items: center;
			gap: 6px;
		}

		.success-message.show {
			display: flex;
		}

		.btn-block {
			width: 100%;
		}

		@media (prefers-reduced-motion: reduce) {
			.password-toggle,
			.requirement,
			.strength-bar {
				transition: none;
			}
		}
	</style>

	<!--if:process.env.RECAPTCHA_PUBLIC && process.env.RECAPTCHA_PUBLIC!=''-->
	<script src='https://www.google.com/recaptcha/api.js'></script>
	<!--/if-->
		
<!--/define:head-->

<!--define:main-->
	
	<div class="p-5 bg-white rounded shadow" style="max-width: 400px; width: 100%;">
		<form id="recoveryForm" action="/api/account/recovery" method="POST" onsubmit="return account_recovery(event)">
			
			<h2 class="mb-4">Reestablecer Contraseña</h2>
			
			<!-- Primera contraseña -->
			<div class="mb-3">
				<label for="password" class="form-label">Nueva contraseña</label>
				<div class="password-field-wrapper">
					<input 
						class="form-control" 
						id="password"
						placeholder="Ingrese su nueva contraseña" 
						name="password" 
						type="password" 
						value=""
						autocomplete="new-password"
						aria-describedby="passwordRequirements"
					/>
					<button 
						type="button" 
						class="password-toggle" 
						id="togglePassword"
						aria-label="Mostrar contraseña"
						tabindex="0"
					>
						<i class="far fa-eye"></i>
					</button>
				</div>

				<!-- Requisitos de contraseña -->
				<div id="passwordRequirements" class="requirements-list">
					<div class="requirement unmet" id="req-length">
						<div class="requirement-icon"><i class="fas fa-check"></i></div>
						<span>Mínimo 8 caracteres</span>
					</div>
					<div class="requirement unmet" id="req-letter">
						<div class="requirement-icon"><i class="fas fa-check"></i></div>
						<span>Al menos una letra (a-z, A-Z)</span>
					</div>
					<div class="requirement unmet" id="req-number">
						<div class="requirement-icon"><i class="fas fa-check"></i></div>
						<span>Al menos un número (0-9)</span>
					</div>
					<div class="requirement unmet" id="req-special">
						<div class="requirement-icon"><i class="fas fa-check"></i></div>
						<span>Al menos un carácter especial (!@#$%^&*)</span>
					</div>
				</div>

				<!-- Indicador de fortaleza -->
				<div class="strength-indicator">
					<div class="strength-bar" id="strengthBar"></div>
				</div>
			</div>

			<!-- Segunda contraseña -->
			<div class="mb-3">
				<label for="password2" class="form-label">Confirmar contraseña</label>
				<div class="password-field-wrapper">
					<input 
						class="form-control" 
						id="password2"
						placeholder="Repita su contraseña" 
						name="password2" 
						type="password" 
						value=""
						autocomplete="new-password"
						aria-describedby="matchMessage"
					/>
					<button 
						type="button" 
						class="password-toggle" 
						id="togglePassword2"
						aria-label="Mostrar contraseña"
						tabindex="0"
					>
						<i class="far fa-eye"></i>
					</button>
				</div>
				<div id="matchMessage" class="error-message">
					<i class="fas fa-times-circle"></i>
					<span>Las contraseñas no coinciden</span>
				</div>
				<div id="matchSuccess" class="success-message">
					<i class="fas fa-check-circle"></i>
					<span>Las contraseñas coinciden</span>
				</div>
			</div>

			<input name="hash" type="hidden" value="{{data:doc.hash}}" />
			
			<!-- reCAPTCHA -->
			<!--if:process.env.RECAPTCHA_PUBLIC && process.env.RECAPTCHA_PUBLIC!=''-->
			<div class="g-recaptcha mb-3" data-sitekey="{{data:process.env.RECAPTCHA_PUBLIC}}"></div>
			<!--/if-->
			
			<button type="submit" class="btn btn-lg btn-success btn-block">Reestablecer</button>
		</form>
	</div>
	
	
	<script>
		const passwordInput = document.getElementById('password');
		const password2Input = document.getElementById('password2');
		const togglePasswordBtn = document.getElementById('togglePassword');
		const togglePassword2Btn = document.getElementById('togglePassword2');
		const strengthBar = document.getElementById('strengthBar');
		const matchMessage = document.getElementById('matchMessage');
		const matchSuccess = document.getElementById('matchSuccess');
		const form = document.getElementById('recoveryForm');

		// Requisitos
		const requirements = {
			length: document.getElementById('req-length'),
			letter: document.getElementById('req-letter'),
			number: document.getElementById('req-number'),
			special: document.getElementById('req-special')
		};

		// Toggle visibilidad contraseña
		togglePasswordBtn.addEventListener('click', (e) => {
			e.preventDefault();
			togglePasswordVisibility(passwordInput, togglePasswordBtn);
		});

		togglePassword2Btn.addEventListener('click', (e) => {
			e.preventDefault();
			togglePasswordVisibility(password2Input, togglePassword2Btn);
		});

		// Permitir Enter en los botones toggle
		togglePasswordBtn.addEventListener('keydown', (e) => {
			if (e.key === 'Enter') {
				e.preventDefault();
				togglePasswordBtn.click();
			}
		});

		togglePassword2Btn.addEventListener('keydown', (e) => {
			if (e.key === 'Enter') {
				e.preventDefault();
				togglePassword2Btn.click();
			}
		});

		function togglePasswordVisibility(input, button) {
			const isPassword = input.type === 'password';
			input.type = isPassword ? 'text' : 'password';
			
			const icon = button.querySelector('i');
			if (isPassword) {
				icon.classList.remove('fa-eye');
				icon.classList.add('fa-eye-slash');
				button.setAttribute('aria-label', 'Ocultar contraseña');
			} else {
				icon.classList.remove('fa-eye-slash');
				icon.classList.add('fa-eye');
				button.setAttribute('aria-label', 'Mostrar contraseña');
			}
		}

		// Validar en tiempo real
		passwordInput.addEventListener('input', validatePassword);
		password2Input.addEventListener('input', validateMatch);

		function validatePassword() {
			const password = passwordInput.value;

			// Validar requisitos
			updateRequirement('length', password.length >= 8);
			updateRequirement('letter', /[a-zA-Z]/.test(password));
			updateRequirement('number', /\d/.test(password));
			updateRequirement('special', /[^\w\s]/.test(password));

			// Actualizar indicador de fortaleza
			updateStrengthIndicator(password);

			// Validar coincidencia si hay contenido en ambos campos
			if (password2Input.value) {
				validateMatch();
			}
		}

		function updateRequirement(key, isMet) {
			const element = requirements[key];
			if (isMet) {
				element.classList.remove('unmet');
				element.classList.add('met');
			} else {
				element.classList.remove('met');
				element.classList.add('unmet');
			}
		}

		function updateStrengthIndicator(password) {
			let strength = 0;
			const maxStrength = 4;

			if (password.length >= 8) strength++;
			if (/[a-zA-Z]/.test(password)) strength++;
			if (/\d/.test(password)) strength++;
			if (/[^\w\s]/.test(password)) strength++;

			strengthBar.className = 'strength-bar';
			
			if (strength <= 1) {
				strengthBar.classList.remove('weak', 'fair', 'strong');
			} else if (strength <= 2) {
				strengthBar.classList.add('weak');
			} else if (strength <= 3) {
				strengthBar.classList.add('fair');
			} else {
				strengthBar.classList.add('strong');
			}
		}

		function validateMatch() {
			const password = passwordInput.value;
			const password2 = password2Input.value;

			if (!password2) {
				matchMessage.classList.remove('show');
				matchSuccess.classList.remove('show');
				password2Input.classList.remove('is-invalid', 'is-valid');
				return;
			}

			if (password === password2) {
				matchMessage.classList.remove('show');
				matchSuccess.classList.add('show');
				password2Input.classList.remove('is-invalid');
				password2Input.classList.add('is-valid');
			} else {
				matchSuccess.classList.remove('show');
				matchMessage.classList.add('show');
				password2Input.classList.remove('is-valid');
				password2Input.classList.add('is-invalid');
			}
		}

		// Validación al enviar
		function account_recovery(event) {
			const password = passwordInput.value;
			const password2 = password2Input.value;

			// Verificar que todos los requisitos se cumplan
			if (!/^(?=.*[a-zA-Z])(?=.*\d)(?=.*[^\w\s]).{8,}$/.test(password)) {
				passwordInput.classList.add('is-invalid');
				event.preventDefault();
				return false;
			}

			// Verificar que las contraseñas coincidan
			if (password !== password2) {
				password2Input.classList.add('is-invalid');
				event.preventDefault();
				return false;
			}

			// Si todo es válido, permitir el envío
			return true;
		}

		// Remover estilos de error al escribir
		passwordInput.addEventListener('input', () => {
			passwordInput.classList.remove('is-invalid');
		});

		password2Input.addEventListener('input', () => {
			password2Input.classList.remove('is-invalid');
		});
	</script>
<!--/define:main-->
