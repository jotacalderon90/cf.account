<!--use:main-->

<!--define:title-->Reestablecer Contraseña<!--/define:title-->

<!--define:head-->

	<!--if:process.env.RECAPTCHA_PUBLIC && process.env.RECAPTCHA_PUBLIC!=''-->
	<script src='https://www.google.com/recaptcha/api.js'></script>
	<!--/if-->
		
<!--/define:head-->

<!--define:main-->
	
	<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
		<div class="p-5 bg-white rounded shadow" style="width: 100%; max-width: 450px;">
			<form action="/api/account/recovery" method="POST" onsubmit="return account_recovery()">
				
				<h2 class="mb-4">Reestablecer Contraseña</h2>
				
				<label for="password" class="form-label">Nueva contraseña</label>
				<div class="input-group">
					<input 
						class="form-control" 
						id="password"
						placeholder="Ingrese su contraseña"
						name="password" 
						type="password" 
						autocomplete="new-password"
					/>
					<button 
						class="btn btn-outline-secondary" 
						type="button" 
						onclick="togglePassword('password', this)"
						aria-label="Mostrar contraseña"
					>
						<i class="fa-solid fa-eye"></i>
					</button>
				</div>

				<div class="form-text mb-3">
					La contraseña debe tener al menos <strong>8 caracteres</strong>,
					incluir al menos <strong>una letra</strong>, <strong>un número</strong>
					y <strong>un carácter especial</strong>.
				</div>

				<label for="password2" class="form-label">Repita la contraseña</label>
				<div class="input-group mb-3">
					<input 
						class="form-control" 
						id="password2"
						placeholder="Repita su contraseña"
						name="password2" 
						type="password" 
						autocomplete="new-password"
					/>
					<button 
						class="btn btn-outline-secondary" 
						type="button" 
						onclick="togglePassword('password2', this)"
						aria-label="Mostrar contraseña"
					>
						<i class="fa-solid fa-eye"></i>
					</button>
				</div>
				
				<input name="hash" type="hidden" value="{{data:doc.hash}}" />
				
				<!--if:process.env.RECAPTCHA_PUBLIC && process.env.RECAPTCHA_PUBLIC!=''-->
				<div class="g-recaptcha mb-3" data-sitekey="{{data:process.env.RECAPTCHA_PUBLIC}}"></div>
				<!--/if-->
				
				<button type="submit" class="btn btn-lg btn-success w-100">
					<i class="fa-solid fa-key me-2"></i>
					Reestablecer
				</button>
			</form>
		</div>
	</div>
	
	<script>
		
		function togglePassword(inputId, button) {
			const input = document.getElementById(inputId);
			const icon = button.querySelector('i');

			if (input.type === 'password') {
				input.type = 'text';
				icon.classList.replace('fa-eye', 'fa-eye-slash');
				button.setAttribute('aria-label', 'Ocultar contraseña');
			} else {
				input.type = 'password';
				icon.classList.replace('fa-eye-slash', 'fa-eye');
				button.setAttribute('aria-label', 'Mostrar contraseña');
			}
		}

		function account_recovery(){
      
			const password = document.forms[0].password.value;
			const password2 = document.forms[0].password2.value;

			if(!/^(?=.*[a-zA-Z])(?=.*\d)(?=.*[^\w\s]).{8,}$/.test(password)) {
				await this.parent.modal.notify("La contraseña no cumple con los requisitos de seguridad" ,'error');
				return false;
			}
      
			if(password !== password2){
				await this.parent.modal.notify("Las contraseñas no coinciden",'error');
				return false;
			}
      
			return true;
		}
		
	</script>
<!--/define:main-->
