		<main class="flex-grow-1 px-md-4 mb-4" style="min-width: 0;">
      <form action="/api/account" method="POST" class="mt-4" onsubmit="return account_update()">
					<h4>Perfil de <small>{{data:doc.user.email}}</small></h4>

	<script>
		
		async function account_update(){
      
      const password = document.forms[0].password.value.trim();
			if(
        password === '' || 
        !/^(?=.*[a-zA-Z])(?=.*\d)(?=.*[^\w\s]).{8,}$/.test(password)){
        await this.parent.modal.notify('Debe ingresar una contraseña segura:\nMínimo 8 caracteres.\nUna letra mayúscula.\nUn número.\nUn carácter especial.', 'error');
				return false;
			}
      
			return true;
		}
		
	</script>
