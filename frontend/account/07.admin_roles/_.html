<!--use:main-->

<!--define:title-->Gestión de Roles | Administración<!--/define:title-->

<!--define:script-->
  <script>
    const roles = {{data:JSON.stringify(doc.user.roles)}};
    const host_database = "{{data:process.env.HOST_DATABASE}}";
  </script>
	<script src="/account/07.admin_roles/_.js"></script>
<!--/define:script-->

<!--define:main-->
	
	<!--include:header-->
	
	<!--include:promise/prompt-->
	
  <div class="d-flex">
		<!--include:account/aside-->
		<div class="resizer"></div>
		<main class="flex-grow-1 px-md-4 mb-4" style="min-width: 0;">
      
      <div class="d-flex justify-content-between align-items-center mt-4 mb-3">
        <h4 class="m-0" v-on:dblclick="object.refresh()" title="Doble click para refrescar">
          <i class="fas fa-user-shield me-2 text-primary"></i>Gestión de Roles
        </h4>
        <button class="btn btn-primary d-flex align-items-center" v-on:click="object.create()">
          <i class="fa fa-plus me-2"></i><span>Nuevo Rol</span>
        </button>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-body p-0">
          <div class="p-3 bg-light border-bottom">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0">
                <i class="fa fa-search text-muted"></i>
              </span>
              <input type="text" class="form-control border-start-0" placeholder="Buscar por nombre o descripción..." v-model="object.filterText">
            </div>
          </div>
          
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th style="width: 50px;">#</th>
                  <th>Nombre</th>
                  <th>Descripción</th>
                  <th class="text-center" style="width: 150px;">Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="(row,index) in object.filteredColl" :key="row._id">
                  <td class="text-muted small">{{index+1}}</td>
                  <td>
                    <span class="badge rounded-pill bg-info text-dark px-3">{{row.nombre}}</span>
                  </td>
                  <td>
                    <span class="text-secondary">{{row.descripcion || 'Sin descripción'}}</span>
                  </td>
                  <td class="text-center">
                    <div class="btn-group btn-group-sm">
                      <button class="btn btn-outline-secondary" v-on:click="object.edit(row)" title="Editar rol">
                        <i class="fa fa-edit"></i>
                      </button>
                      <a target="_blank" class="btn btn-outline-primary" :href="object.host_database() + row._id" title="Ver JSON en DB">
                        <i class="fa fa-database"></i>
                      </a>
                      <button class="btn btn-outline-danger" v-on:click="object.delete(row._id)" title="Eliminar rol">
                        <i class="fa fa-trash"></i>
                      </button>
                    </div>
                  </td>
                </tr>
                <tr v-if="object.filteredColl.length === 0">
                  <td colspan="4" class="text-center py-5 text-muted">
                    <i class="fa fa-info-circle me-1"></i> No se encontraron roles que coincidan con la búsqueda.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          
          <div class="card-footer bg-white d-flex justify-content-between align-items-center">
            <span class="small text-muted">Mostrando {{object.filteredColl.length}} de {{object.cant}} roles</span>
            <button v-if="object.coll.length < object.cant" class="btn btn-sm btn-link text-decoration-none" v-on:click="object.getCollection()">
              Cargar más <i class="fa fa-chevron-down ms-1"></i>
            </button>
          </div>
        </div>
      </div>
      
    </main>
  </div>

<!--/define:main-->
