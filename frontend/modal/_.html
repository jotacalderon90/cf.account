
  <!-- Modal para notificar -->
  <div class="modal fade" 
    id="mdNotify" 
    tabindex="-1" 
    aria-hidden="true"
    data-bs-backdrop="static"
    data-bs-keyboard="false">
		<div class="modal-dialog modal-dialog-centered modal-sm">
			<div class="modal-content">
				<div class="modal-header" :class="modal.notifyType === 'error' ? 'bg-danger text-white' : 'bg-success text-white'">
					<h6 class="modal-title">
						<i :class="modal.notifyType === 'error' ? 'fa fa-exclamation-circle' : 'fa fa-check-circle'" class="me-2"></i>
						{{ modal.notifyType === 'error' ? 'Error' : 'Listo' }}
					</h6>
				</div>
				<div class="modal-body">
					<p class="mb-0">{{ modal.notifyMsg }}</p>
				</div>
				<div class="modal-footer py-2">
					<button type="button" class="btn btn-sm btn-light" id="btnMdAceptar">Aceptar</button>
				</div>
			</div>
		</div>
	</div>
  
  <!-- Modal para solicitar confirmación -->
  <div class="modal fade"
     id="mdConfirm"
     tabindex="-1"
     aria-hidden="true"
     data-bs-backdrop="static"
     data-bs-keyboard="false">

    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title d-flex align-items-center">
            <i class="fa fa-circle-question text-warning me-2"></i>
            Confirmación
          </h5>
        </div>
        <div class="modal-body pt-2">
          <p class="mb-0 text-muted">
            {{ modal.message }}
          </p>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">
            {{ modal.cancelText || 'Cancelar' }}
          </button>
          <button type="button" class="btn btn-primary" id="btnMdConfirmOk">
            {{ modal.okText || 'Aceptar' }}
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Modal para Desplegar HTML -->
  <div class="modal fade"
     id="mdHtml"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title d-flex align-items-center">
            <i class="fa fa-circle-question text-warning me-2"></i>
            {{modal.title}}
          </h5>
					<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-2">
          <div id="dvMdHtml" style="max-width: 100%;overflow:scroll"></div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="modal/_.js"></script>
