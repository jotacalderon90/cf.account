
  <!-- Modal para solicitar confirmación -->
  <div class="modal fade"
     id="mdConfirm"
     tabindex="-1"
     aria-hidden="true"
     data-bs-backdrop="static"
     data-bs-keyboard="false">

    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title d-flex align-items-center">
            <i class="fa fa-circle-question text-warning me-2"></i>
            Confirmación
          </h5>
        </div>
        <div class="modal-body pt-2">
          <p class="mb-0 text-muted">
            {{ modal.message }}
          </p>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-light" id="btnMdConfirmCancel">
            {{ modal.cancelText || 'Cancelar' }}
          </button>
          <button type="button" class="btn btn-primary" id="btnMdConfirmOk">
            {{ modal.okText || 'Aceptar' }}
          </button>
        </div>
      </div>
    </div>
  </div>
